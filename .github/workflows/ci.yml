name: V2 CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quoteops_v2_ci
          POSTGRES_USER: quoteops_v2_ci
          POSTGRES_PASSWORD: quoteops_v2_ci_password
        options: >-
          --health-cmd "pg_isready -U quoteops_v2_ci -d quoteops_v2_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      QUOTEOPS_ENV: test
      QUOTEOPS_DATABASE_URL: postgresql+psycopg://quoteops_v2_ci:quoteops_v2_ci_password@localhost:5432/quoteops_v2_ci
      QUOTEOPS_CORS_ORIGINS: http://localhost:5173
      QUOTEOPS_AUTH_SECRET: ci-test-only-auth-secret-not-for-reuse
      QUOTEOPS_DOCS_ENABLED: "true"
      QUOTEOPS_OPENAPI_ENABLED: "true"
      QUOTEOPS_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Verify backend foundation
        run: |
          python -m compileall backend
          alembic upgrade head
          alembic current
          python -m pytest -q backend/tests

      - name: Refuse a README that miscounts its own tests
        # 손으로 적은 수는 낡는다 — 이 README의 앞 판은 저장소가 V2-10까지 간
        # 뒤에도 "V2-01B 기초 단계"라고 말하고 있었고, 외부 평가가 그 문장을
        # 근거로 저장소를 실제보다 낮게 봤다. 문장 전체를 기계가 지킬 수는
        # 없지만 숫자는 지킬 수 있다.
        run: |
          claimed=$(grep -oE '백엔드 \*\*[0-9]+개\*\*' README.md | grep -oE '[0-9]+')
          comment=$(grep -oE '# [0-9]+ tests' README.md | grep -oE '[0-9]+' | head -1)
          collected=$(python -m pytest --collect-only -q backend/tests 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          echo "README 표 ${claimed:-none} · 명령 주석 ${comment:-none} vs collected ${collected:-none}"
          if [ -z "${claimed}" ] || [ -z "${comment}" ] || [ -z "${collected}" ]; then
            echo "::error::수를 읽지 못했다. 문장이 바뀌었으면 이 관문도 함께 고쳐라 — 빈 값으로 통과시키지 않는다."
            exit 1
          fi
          if [ "${claimed}" != "${collected}" ] || [ "${comment}" != "${collected}" ]; then
            echo "::error::README says ${claimed}/${comment} backend tests; pytest collects ${collected}."
            exit 1
          fi

  frontend-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify frontend foundation
        run: |
          pnpm --dir frontend test
          pnpm --dir frontend build
